openapi: 3.0.3

info:
  title: Avito Kitchen API
  description: API сервиса заказа еды
  version: 1.0.0

servers:
  - url: http://localhost:3001

paths:

  /_info:
    get:
      summary: Проверка работоспособности сервиса
      responses:
        '200':
          description: Сервис работает

  /register:
    post:
      summary: Регистрация пользователя
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Иван
              email: ivan@example.com
              password: password123
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              example:
                user:
                  id: 1
                  name: Иван
                  email: ivan@example.com
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJleHAiOjE3ODg5Nzc1NDN9.V3rdRgGcdVr2eRYBWBARQKYpALrJLWl0LtDt4LOjiqY"
        '400':
          description: Некорректные данные

  /login:
    post:
      summary: Авторизация пользователя
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: ivan@example.com
              password: password123
      responses:
        '200':
          description: Успешная авторизация
          content:
            application/json:
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJleHAiOjE3ODg5Nzc1NDN9.V3rdRgGcdVr2eRYBWBARQKYpALrJLWl0LtDt4LOjiqY"

        '401':
          description: Неверный email или пароль

  /restaurants:
    get:
      summary: Получить список ресторанов
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список ресторанов
          content:
            application/json:
              example:
                restaurants:
                  - id: 1
                    name: Example Restaurant
                  - id: 2
                    name: Pizza Place

        '401':
          description: Требуется авторизация

  /restaurants/{id}/products:
    get:
      summary: Получить меню ресторана
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор ресторана
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Список товаров ресторана
          content:
            application/json:
              example:
                products:
                  - id: 1
                    name: Пицца Маргарита
                    price: 500
                    is_available: true
                  - id: 2
                    name: Кола
                    price: 150
                    is_available: false

        '401':
          description: Требуется авторизация

        '404':
          description: Ресторан не найден

  /orders:
    get:
      summary: Получить заказы текущего пользователя
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список заказов
          content:
            application/json:
              example:
                - id: 10
                  restaurant_id: 1
                  user_id: 1
                  restaurant_order_id: 15
                  status: cooking
                  total_price: 3949
                  created_at: "2026-09-07T23:04:48+03:00"

        '401':
          description: Требуется авторизация

    post:
      summary: Создать заказ
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              restaurant_id: 1
              items:
                - product_id: 1
                  quantity: 2
                - product_id: 2
                  quantity: 1
      responses:
        '201':
          description: Заказ успешно создан
          content:
            application/json:
              example:
                id: 10
                restaurant_id: 1
                user_id: 1
                restaurant_order_id: 15
                status: new
                total_price: 1150
                created_at: "2026-09-07T23:04:48+03:00"

        '400':
          description: Некорректные данные заказа

        '401':
          description: Требуется авторизация

  /orders/{id}:
    get:
      summary: Получить подробную информацию о заказе
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор заказа
          schema:
            type: integer
            format: int64
            example: 10
      responses:
        '200':
          description: Информация о заказе
          content:
            application/json:
              example:
                id: 10
                restaurant_id: 1
                user_id: 1
                restaurant_order_id: 15
                status: cooking
                total_price: 3949
                created_at: "2026-09-07T23:04:48+03:00"
                items:
                  - restaurant_product_id: 1
                    name: Пицца Маргарита
                    price: 500
                    quantity: 2
                  - restaurant_product_id: 2
                    name: Кола
                    price: 150
                    quantity: 1

        '401':
          description: Требуется авторизация

        '404':
          description: Заказ не найден

  /integration/orders/status:
    post:
      summary: Обновить статус заказа
      description: |
        Используется рестораном для уведомления Kitchen
        об изменении статуса заказа.
      security:
        - restaurantApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              kitchen_order_id: 15
              status: cooking
      responses:
        '200':
          description: Статус заказа успешно обновлён
          content:
            application/json:
              example:
                id: 10
                restaurant_id: 1
                user_id: 1
                restaurant_order_id: 15
                status: cooking
                total_price: 3949
                created_at: "2026-09-07T23:04:48+03:00"

        '401':
          description: Неверный API-ключ

        '404':
          description: Заказ не найден

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    restaurantApiKey:
      type: apiKey
      in: header
      name: X-API-Key